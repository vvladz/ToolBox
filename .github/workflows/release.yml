name: Release ToolBox

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  VERSION: "1.0.${{ github.run_number }}"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test ToolBox.slnx -c Release

      - name: Test installer
        run: ./tests/Install.Tests.ps1

      - name: Publish ToolBox.exe
        run: >-
          dotnet publish src/ToolBox/ToolBox.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=embedded
          -p:Version=${{ env.VERSION }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o publish

      - name: Smoke test the release executable
        run: ./publish/ToolBox.exe --help

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: publish/ToolBox.exe
          fail_on_unmatched_files: true
